[project]
name = "real-estate-content-agent"
version = "0.1.0"
description = "An autonomous agent that turns a real estate listing into an on-brand social content batch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Uncomment when we wire real Claude calls in Session 3:
# llm = ["anthropic>=0.34"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
